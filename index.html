<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes | Play Bold</title>
    
    <link rel="manifest" href="/Vault/manifest.json">
    <link rel="apple-touch-icon" href="/Vault/logo.png">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { 
            --rcb-red: #ff3333; 
            --rcb-gold: #d4a373; 
            --bg-dark: #121212;
            --card-dark: #1e1e1e;
            --text-bright: #ffffff;
            --text-dim: #b0b0b0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-dark);
            margin: 0; 
            min-height: 100vh;
            font-size: 18px;
            color: var(--text-bright);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('https://imgk.timesnownews.com/story/RCB-logo-Twitter.jpg?tr=w-600,h-450,fo-auto');
            background-size: 60%; 
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.05; 
            z-index: -1;
            pointer-events: none;
        }

        .search-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(18, 18, 18, 0.95); 
            padding: 15px 0;
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            border-bottom: 2px solid var(--rcb-red);
        }

        .search-box {
            width: 90%; 
            max-width: 400px;
            display: flex;
            align-items: center;
            background: #2a2a2a;
            border-radius: 50px;
            padding: 10px 20px;
            border: 1px solid #444; 
        }

        .search-box input { 
            border: none; 
            width: 100%; 
            padding: 8px; 
            outline: none; 
            font-size: 1.1rem; 
            background: transparent;
            color: white;
        }

        .container { 
            max-width: 950px; 
            margin: 0 auto;
            padding: 20px;
        }

        header h1 { 
            font-family: 'Fraunces', serif; 
            text-align: center;
            color: var(--rcb-red); 
            font-size: 4rem;
            margin: 20px 0;
            letter-spacing: -1px;
        }

        .form-card { 
            background: var(--card-dark); 
            padding: 25px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* Fixed Input Group to make ADD button uniform */
        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        input, select, .btn-add { 
            width: 100%; /* Forces everything to same width */
            box-sizing: border-box;
            background: #2a2a2a;
            border: 1px solid #444; 
            padding: 18px; 
            border-radius: 12px; 
            outline: none; 
            font-size: 1.1rem; 
            color: white;
            font-family: 'Inter', sans-serif;
        }
        
        .btn-add { 
            background: var(--rcb-red);
            border: none;
            font-weight: 800; 
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: opacity 0.2s ease;
        }

        .btn-add:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .filter-bar { 
            display: flex; 
            gap: 12px; 
            justify-content: flex-start; 
            margin-bottom: 35px; 
            overflow-x: auto; 
            padding: 10px 5px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-btn { 
            background: #2a2a2a; 
            border: 2px solid #444; 
            padding: 14px 28px; 
            border-radius: 50px; 
            font-size: 1.15rem; 
            cursor: pointer; 
            color: var(--text-dim); 
            font-weight: 800;
            white-space: nowrap;
        }

        .filter-btn.active { 
            background: var(--rcb-red); 
            color: white; 
            border-color: var(--rcb-red);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        #recipeGrid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
        }
        
        .recipe-card { 
            background: var(--card-dark); 
            border-radius: 24px; 
            overflow: hidden; 
            border: 1px solid #333;
        }

        .img-container { height: 200px; position: relative; }
        .recipe-img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.9); }
        
        .card-body { padding: 22px; }
        .card-category { font-size: 0.85rem; color: var(--rcb-gold); font-weight: 800; text-transform: uppercase; margin-bottom: 8px; }
        .card-title { font-family: 'Fraunces', serif; font-size: 1.6rem; margin: 0 0 20px 0; color: white; line-height: 1.2; }

        .card-actions { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-top: 1px solid #333; 
            padding-top: 20px; 
        }
        
        .btn-open { color: var(--rcb-red); font-size: 0.95rem; text-decoration: none; font-weight: 800; letter-spacing: 1px; }
        
        .action-icons { display: flex; gap: 20px; }
        .icon-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #666; }

        @media (min-width: 600px) {
            .filter-bar { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="search-container">
    <div class="search-box">
        <i class="fas fa-search" style="color: var(--rcb-red); margin-right: 12px;"></i>
        <input type="text" id="recipeSearch" placeholder="Search your recipes..." onkeyup="renderRecipes()">
    </div>
</div>

<div class="container">
    <header><h1>Recipes</h1></header>

    <div class="form-card">
        <div class="input-group">
            <input type="text" id="customName" placeholder="Rename (Optional)">
            <input type="url" id="recipeUrl" placeholder="Paste link here...">
            <select id="recipeCategory">
                <option value="Dinner">Dinner</option>
                <option value="Lunch">Lunch</option>
                <option value="Breakfast">Breakfast</option>
                <option value="Dessert">Dessert</option>
                <option value="Snack">Snack</option>
            </select>
            <button class="btn-add" id="addBtn" onclick="addRecipe()">ADD</button>
        </div>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="setFilter('All')">All</button>
        <button class="filter-btn" onclick="setFilter('Breakfast')">Breakfast</button>
        <button class="filter-btn" onclick="setFilter('Lunch')">Lunch</button>
        <button class="filter-btn" onclick="setFilter('Dinner')">Dinner</button>
        <button class="filter-btn" onclick="setFilter('Dessert')">Dessert</button>
        <button class="filter-btn" onclick="setFilter('Snack')">Snack</button>
    </div>

    <div id="recipeGrid"></div>
</div>

<script>
    const SUPABASE_URL = 'https://rwjvhruqqyzdriwufgdu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_I2pte2qgqfZ8qtZ05asmxw_FCX2IMBg';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentFilter = 'All';

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/Vault/sw.js', { scope: '/Vault/' });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const parsedUrl = new URL(window.location);
        const sharedUrl = parsedUrl.searchParams.get('link') || parsedUrl.searchParams.get('description') || parsedUrl.searchParams.get('text') || parsedUrl.searchParams.get('url');
        const sharedTitle = parsedUrl.searchParams.get('name') || parsedUrl.searchParams.get('title');

        if (sharedUrl) {
            document.getElementById('recipeUrl').value = sharedUrl;
            if (sharedTitle) document.getElementById('customName').value = sharedTitle;
            document.getElementById('recipeCategory').focus();
        }
        renderRecipes();
    });

    function setFilter(category) {
        currentFilter = category;
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText === category) btn.classList.add('active');
        });
        renderRecipes();
    }

    async function addRecipe() {
        const urlInput = document.getElementById('recipeUrl');
        const nameInput = document.getElementById('customName');
        const url = urlInput.value.trim();
        const customName = nameInput.value.trim();
        const category = document.getElementById('recipeCategory').value;
        const btn = document.getElementById('addBtn');

        if (!url) return;
        btn.innerText = "SAVING...";
        btn.disabled = true;

        try {
            const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
            const data = await res.json();
            
            const finalName = customName || (data.data && data.data.title) || "New Recipe";
            const image = (data.data && data.data.image) ? data.data.image.url : 'https://images.unsplash.com/photo-1495195129352-aec329a778a5?auto=format&fit=crop&w=600&q=80';
            
            await supabaseClient.from('recipes').insert([{ name: finalName, url: url, img: image, category: category }]);
            
            urlInput.value = '';
            nameInput.value = '';
            renderRecipes();
        } catch (e) {
            console.error(e);
            alert("Error saving.");
        } finally { 
            btn.innerText = "ADD"; 
            btn.disabled = false; 
        }
    }

    async function renderRecipes() {
        const searchTerm = document.getElementById('recipeSearch').value.toLowerCase();
        let { data: recipes } = await supabaseClient.from('recipes').select('*').order('id', { ascending: false });
        
        if (currentFilter !== 'All') recipes = (recipes || []).filter(r => r.category === currentFilter);
        
        if (searchTerm) {
            recipes = (recipes || []).filter(r => 
                r.name.toLowerCase().includes(searchTerm) || 
                r.category.toLowerCase().includes(searchTerm)
            );
        }

        const grid = document.getElementById('recipeGrid');
        grid.innerHTML = (recipes || []).map(r => `
            <div class="recipe-card">
                <div class="img-container">
                    <img src="${r.img}" class="recipe-img" onerror="this.src='https://images.unsplash.com/photo-1495195129352-aec329a778a5?auto=format&fit=crop&w=600&q=80'">
                </div>
                <div class="card-body">
                    <div class="card-category">${r.category}</div>
                    <div class="card-title">${r.name}</div>
                    <div class="card-actions">
                        <a href="${r.url}" target="_blank" class="btn-open">VIEW RECIPE</a>
                        <div class="action-icons">
                            <button onclick="editRecipe(${r.id}, '${r.name.replace(/'/g, "\\'")}')" class="icon-btn">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteRecipe(${r.id})" class="icon-btn">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function editRecipe(id, currentName) {
        const newName = prompt("Rename recipe:", currentName);
        if (newName === null || newName.trim() === "" || newName === currentName) return;

        try {
            await supabaseClient.from('recipes').update({ name: newName.trim() }).eq('id', id);
            renderRecipes();
        } catch (e) {
            console.error(e);
        }
    }

    async function deleteRecipe(id) {
        if(confirm("Delete recipe?")) {
            await supabaseClient.from('recipes').delete().eq('id', id);
            renderRecipes();
        }
    }
</script>
</body>
</html>
